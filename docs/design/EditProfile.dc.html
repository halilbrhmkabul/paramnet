<style>
body{margin:0;background:#E9ECE8}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
.scr{width:390px;font-family:Manrope,'Segoe UI',system-ui,sans-serif;color:#13221B;background:#F5F7F4;display:flex;flex-direction:column;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.top{display:flex;align-items:center;gap:8px;padding:12px 16px 8px}
.ib{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#13221B;flex:none}

.ttl{flex:1;text-align:center;font-weight:800;font-size:17px;margin:0}

.fl{display:flex;flex-direction:column;gap:6px}
.fl>label{font-size:13px;font-weight:700;color:#3E4C45;padding:0 4px}

.inp input{border:0;outline:0;background:none;flex:1;min-width:0;font-size:16px;font-weight:600}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ok{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:#11613F;white-space:nowrap}
.pa{height:44px;padding:0 14px;border-radius:12px;border:1px solid #D5DCD6;background:#FFFFFF;font-size:14px;font-weight:700;color:#0F3A2E;display:flex;align-items:center;gap:6px}
.btn{height:54px;border-radius:16px;background:#0F3A2E;color:#FFFFFF;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}

		<label for="em">E-posta</label>
		<div class="inp"><input id="em" value="deniz.yilmaz@ornek.com" inputmode="email"></div>
	</section>

	<section class="sec">
		<div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; background: #EEF3EF">

	<div style="margin-top: auto; padding: 8px 16px 32px">

# Signs in from a clean install; continues through the profile steps only for a new account.
appId: com.paramnet.app
---
- launchApp:
    clearState: true
- tapOn:
    id: welcome.skip.button
- tapOn:
    id: phone.number.input
- inputText: "5550000001"
- tapOn:
    id: phone.continue.button
- tapOn:
    id: otp.code.input
- inputText: "123456"
- runFlow:
    when:
      visible:
        id: profile.screen
    commands:
      - tapOn:
          id: profile.name.input
      - inputText: "Maestro"
      - tapOn:
          id: profile.consent.checkbox
      - tapOn:
          id: profile.save.button
      - tapOn:
          id: notifications.later.button
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 15000

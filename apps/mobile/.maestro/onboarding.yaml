# Karşılama (01) → tanıtım (31) → Kayıt ol (02) → OTP (test kodu) → PIN → profil → Ana Sayfa;
# ardından çıkış yapmadan PIN ile giriş ayrı akışta denenebilir (subflows/login.yaml).
appId: com.paramnet.app
---
- launchApp:
    clearState: true
- assertVisible:
    id: welcome.screen
- tapOn:
    id: welcome.create.button
- assertVisible: "1 / 3"
- tapOn:
    id: onboarding.next.button
- tapOn:
    id: onboarding.next.button
- tapOn:
    id: onboarding.next.button
- assertVisible: "Hesap oluştur"
- tapOn:
    id: login.phone.input
- inputText: "5550000002"
# Sayısal klavyede kapatma tuşu yok; kullanıcı gibi sürükleyerek kapatılır.
- swipe:
    start: "50%, 30%"
    end: "50%, 45%"
    duration: 400
- tapOn:
    id: login.submit.button
- tapOn:
    id: otp.code.input
- inputText: "000000"
- assertVisible: "Kod hatalı. Tekrar dener misin?"
- eraseText: 6
- inputText: "123456"
- runFlow:
    when:
      visible:
        id: pin.screen
    commands:
      - inputText: "123456"
      - assertVisible: "Bu şifre kolay tahmin edilir. Art arda ya da aynı rakamlar kullanma."
      - inputText: "482915"
      - inputText: "482915"
- runFlow:
    when:
      visible:
        id: profile.screen
    commands:
      - tapOn:
          id: profile.name.input
      - inputText: "Maestro"
      - tapOn:
          id: profile.consent.checkbox
      # Sayısal klavyede kapatma tuşu yok; kullanıcı gibi sürükleyerek kapatılır.
      - swipe:
          start: "50%, 30%"
          end: "50%, 45%"
          duration: 400
      - tapOn:
          id: profile.save.button
      - assertVisible:
          id: notifications.screen
      - tapOn:
          id: notifications.later.button
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 15000
